<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>doTrackit Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              }
            },
            screens: {
              'print': {'raw': 'print'},
            }
          }
        }
      }
    </script>
    <style>
      @media print {
        body {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        .recharts-responsive-container {
          min-height: 300px !important;
          width: 100% !important;
        }
        section, .rounded-lg {
          break-inside: avoid;
        }
        .overflow-x-auto {
          overflow-x: visible !important;
        }
        ::-webkit-scrollbar {
          display: none;
        }
      }

      /* PDF Export Specific Styles */
      /* STRICT width to match Letter/A4 and prevent cut-off */
      .pdf-export-mode {
        width: 790px !important; 
        min-width: 790px !important;
        max-width: 790px !important;
        margin: 0 !important; /* Reset auto margins to ensure capture starts at 0,0 */
        background-color: #ffffff !important;
        padding: 20px !important;
        color: #0f172a !important;
        position: relative !important;
        left: 0 !important;
        top: 0 !important;
      }

      /* PDF Header */
      .pdf-header {
        display: none;
      }
      .pdf-export-mode .pdf-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-bottom: 2px solid #0f172a;
        padding-bottom: 10px;
        margin-bottom: 20px;
      }

      /* Hiding elements in PDF */
      .pdf-export-mode header,
      .pdf-export-mode button, 
      .pdf-export-mode .print\:hidden,
      .pdf-export-mode .no-pdf,
      .pdf-export-mode .pdf-hide {
        display: none !important;
      }

      /* PDF Specific Layouts */
      .pdf-export-mode .pdf-summary-grid {
        display: flex !important;
        flex-direction: column !important;
        gap: 20px !important;
        margin-bottom: 20px !important;
      }

      /* Force 3-column Grid for Charts in PDF */
      .pdf-export-mode .pdf-charts-grid {
        display: grid !important;
        grid-template-columns: repeat(3, 1fr) !important;
        gap: 12px !important;
        margin-bottom: 20px !important;
        width: 100% !important;
        break-inside: avoid !important;
      }
      
      /* Scale down charts inside grid */
      .pdf-export-mode .pdf-charts-grid > div {
         width: 100% !important;
         margin: 0 !important;
         height: 240px !important; /* Fixed height for row */
         padding: 10px !important; /* Reduce padding */
      }
      
      /* Explicit Page Breaks */
      .pdf-page-break {
        display: block;
        height: 1px;
        margin: 10px 0;
      }
      .pdf-export-mode .pdf-page-break {
        display: none !important;
      }
      
      /* Section Breaker for PDF */
      .pdf-export-mode .pdf-break-before {
         page-break-before: always !important;
         margin-top: 20px !important;
         display: block !important;
      }
      
      /* Reset Container Styles for PDF - Make them look like document sections */
      .pdf-export-mode section,
      .pdf-export-mode .rounded-xl,
      .pdf-export-mode .rounded-lg {
        box-shadow: none !important;
        border: 1px solid #e2e8f0 !important; 
        break-inside: avoid !important;
        background-color: #ffffff !important;
        border-radius: 8px !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
      }

      /* Clean up Recharts Tooltips in PDF */
      .pdf-export-mode .recharts-tooltip-wrapper {
        display: none !important;
      }
      
      /* Gantt Chart Optimization for PDF */
      .pdf-export-mode .gantt-container {
        width: 100% !important;
        border: 1px solid #e2e8f0 !important;
        margin-top: 0 !important;
        break-inside: avoid !important;
        overflow: visible !important;
        display: block !important;
      }
      .pdf-export-mode .gantt-scroll-area {
        overflow: visible !important;
        width: 100% !important;
        display: block !important;
      }
      
      /* Force Charts to be visible */
      .pdf-export-mode .recharts-responsive-container {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3",
    "react-markdown": "https://esm.sh/react-markdown@9?bundle"
  }
}
</script>
</head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
